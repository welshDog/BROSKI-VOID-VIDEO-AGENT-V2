# 🎬 BROski Void Video Agent V2 — the full stack
#
# Cloud only:            docker compose up -d
# With FREE GPU lane:    docker compose --profile local up -d

services:
  orchestrator:
    build:
      context: .
      dockerfile: agent-router/Dockerfile
    env_file: .env
    volumes:
      - ./workspace:/app/workspace
      - ./output:/app/output
      - ./config:/app/config
    ports:
      - "3000:3000"   # reserved for the future web UI
    command: ["npx", "tsx", "agent-router/index.ts", "--help"]

  comfyui:
    # 🦙 FREE generation lane — Wan 2.2 local (needs NVIDIA GPU)
    image: ghcr.io/comfyanonymous/comfyui:latest
    profiles: ["local"]
    ports:
      - "8188:8188"
    volumes:
      - ./polish/comfyui-workflows:/comfyui/user/default/workflows:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
