# LongCat inference overlay — run alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.longcat.yml up -d --build longcat-inference
# Weights live on the host in ./weights (see LONGCAT_SETUP.md).
services:
  longcat-inference:
    build:
      context: .
      dockerfile: Dockerfile.longcat
    image: broski/longcat-inference:latest
    container_name: longcat-inference
    restart: unless-stopped
    environment:
      LONGCAT_GPUS: "1"          # set to your GPU count (drives context_parallel_size)
    volumes:
      - ./weights:/weights       # model weights — downloaded on host, never baked in
      - longcat-output:/output   # finished videos
    ports:
      - "8000:8000"              # optional — for local testing only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  longcat-output:
